name: Release
run-name: "Release ${{ github.ref_name }}"

# Everything this release does lives in cameraunlock-core's release-mod.yml.
# Only the values below are this mod's. Pinned to a commit SHA, never a branch:
# that workflow runs with contents:write, the Discord webhook and the Lopari PAT.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-mod.yml@a03c24290fae3a9c61f67adcb7c5ba4eedf69f20
    with:
      project-name: 'Head Tracking for Indiana Jones and the Great Circle'
      version-source: cmake
      version-path: 'CMakeLists.txt'
      # Must stay identical to $shippingPaths in scripts/release.ps1, which
      # generates the CHANGELOG from the same filter. Two lists meant one
      # version shipped two different accounts of what changed in it.
      artifact-paths: 'src/ cameraunlock-core/ scripts/install.cmd scripts/uninstall.cmd vendor/ launcher-manifest.json'
      setup-msbuild: true
    permissions:
      contents: write
    secrets: inherit
