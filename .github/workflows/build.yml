name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    # This job reads the tree and writes nothing back. Spelled out rather than
    # left to the repository default, which is a setting outside this repo that
    # anyone with admin can flip to read/write - and this workflow runs on a push
    # to any branch, so a token wider than the job needs would be handed to
    # whatever is on that branch. release.yml already scopes its own write.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (cmake configure -> build ->
      # package); the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      # The seven suites the pixi `test` task aggregates. Nothing automated ran
      # any of them before this step existed: `pixi run package` COMPILES the
      # test executables, so a build break was caught, but not one assertion was
      # ever evaluated. A sign flip in the camera composition, the reticle
      # projection or the zoom conversion - the three that have no in-game
      # symptom until a player reports the view going the wrong way - merged
      # green. After `package`, so a failure here does not hide a packaging
      # failure.
      - name: Test
        shell: pwsh
        run: pixi run test

      - name: Verify installer was produced
        shell: pwsh
        run: |
          # -ErrorAction SilentlyContinue is load-bearing: GitHub prepends
          # $ErrorActionPreference = 'stop' to every pwsh step, so a missing
          # release/ would throw here and kill the step before it could print the
          # annotation below, which is the whole point of the block.
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }

      # launcher-manifest.json is the launcher's contract and nothing else in
      # the build reads it, so a files[] source that stops matching what is
      # staged stays invisible until a tag is pushed and release.ps1 runs this
      # same validator - by which point the version is already stamped. Run
      # against the ZIP just produced. The validator is invoked directly rather
      # than through `pixi run validate-manifest` so it checks that ZIP instead
      # of repackaging it.
      - name: Validate launcher manifest
        shell: pwsh
        run: node cameraunlock-core/scripts/validate-manifest.mjs
